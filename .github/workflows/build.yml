name: Build and Test

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: Windows .NET 10
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore HP330.slnx

      - name: Build
        run: dotnet build HP330.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/HP330.Tests/HP330.Tests.csproj --configuration Release --no-build
